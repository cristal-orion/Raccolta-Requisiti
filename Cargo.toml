[package]
name = "raccolta-requisiti"
version = "0.1.0"
edition = "2024"

[dependencies]
# Il selettore dei file passa dal portale XDG (FileChooser): serve questa feature.
rune = { path = "vendor/rune/crates/rune", features = ["native-file-dialog"] }
rune-kit = { path = "vendor/rune/crates/rune-kit" }
rune-mermaid = { path = "vendor/rune/crates/rune-mermaid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
